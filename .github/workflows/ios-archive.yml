# iOS archive from the Xcode project exported by Unity on Windows (no Unity on the runner).
# Prepared, NOT enabled: it needs a Team ID, a distribution certificate and a profile (repository secrets, set by the owner).
# Cost: GitHub macOS minutes (Free plan: 2,000 min/month × multiplier 10 for macOS). The 50 € reserve is a ceiling, not unlimited authorization.
name: ios-archive
on:
  workflow_dispatch:
    inputs:
      xcode_project_artifact:
        description: "Nome do artefacto com o projeto Xcode exportado (zip)"
        required: true
        default: "xcode-project"
jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Descarregar projeto Xcode exportado
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.xcode_project_artifact }}
          path: xcode
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || true; xcodebuild -version
      - name: Arquivo (sem assinatura automática enquanto não houver segredos)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd xcode
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release -sdk iphoneos \
            -archivePath build/ThatDamnFly.xcarchive archive CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: ThatDamnFly.xcarchive
          path: xcode/build/ThatDamnFly.xcarchive
